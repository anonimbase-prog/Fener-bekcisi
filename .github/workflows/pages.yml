name: Siteyi yayinla (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siteyi hazirla
        run: |
          mkdir site
          cp index.html manifest.webmanifest sw.js apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png site/
          sed -i "s/fener-v[0-9a-f]*/fener-${GITHUB_SHA::7}/" site/sw.js
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
