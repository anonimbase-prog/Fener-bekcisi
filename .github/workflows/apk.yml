name: Android APK derle

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/apk.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Oyunu Android paketine kopyala
        run: python3 tools/android_html.py index.html android/app/src/main/assets/index.html
      - name: APK derle
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Fener-Bekcisi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Surume ekle (v ile baslayan etiket)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
